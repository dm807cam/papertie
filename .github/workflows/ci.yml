# Lint, typecheck and the unit suites, on every push to main and every pull request. No Electron
# and no end-to-end tests here: those run on a developer's machine (`pnpm e2e:desktop`,
# `pnpm e2e:app`) and, for the packaged Linux app, in the release workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # The unit tests need no Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Core
        run: pnpm --filter @papertie/core test

      - name: Store
        run: pnpm --filter @papertie/server test

      - name: Store, crash tests
        run: pnpm --filter @papertie/server test:crash

      - name: Web
        run: pnpm --filter @papertie/web test

      - name: Tools
        run: pnpm --filter @papertie/tools test

      - name: Desktop
        run: pnpm --filter @papertie/desktop test
